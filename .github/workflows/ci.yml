name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '^22.22.3'
  DOTNET_VERSION: 10.0.401

jobs:
  host:
    name: Host build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build (warnings as errors)
        run: dotnet build MacroDeck.slnx -warnaserror
      - name: Unit tests
        run: >
          dotnet test MacroDeck.slnx --no-build
          --filter 'FullyQualifiedName!~MacroDeck.Plugin.Testing.Tests.ConformanceTests'
          --logger trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: host/tests/**/TestResults/*.trx
          if-no-files-found: ignore

  ui:
    name: UI runtime & Svelte admin
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install workspace dependencies
        working-directory: ui
        run: npm ci
      - name: Runtime tests
        working-directory: ui/runtime
        run: npm run test
      - name: Svelte type check
        working-directory: ui/svelte
        run: npm run check
      - name: Svelte tests
        working-directory: ui/svelte
        run: npx vitest run
      - name: Svelte boundary checks
        working-directory: ui/svelte
        run: npm run test:boundaries
